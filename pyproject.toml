[project]
name = "personal-knowledge-agent"
version = "0.1.0"
description = "Self-hosted RAG agent grounded in personal notes, code and documents, with a persistent memory layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "karuna1806" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "redis>=5.0",
    "aio-pika>=9.4",
    "openai>=1.40",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
    "pypdf>=4.3",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fpdf2>=2.7",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pka"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: needs Postgres, Redis and RabbitMQ (docker compose up postgres redis rabbitmq)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]
